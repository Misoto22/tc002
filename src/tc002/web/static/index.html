<!doctype html>
<html lang="en" data-theme="system" data-palette="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="tc002-token" content="{{TOKEN}}" />
    <meta name="color-scheme" content="light dark" />
    <title>tc002</title>
    <!-- palettes first: tokens.css's dark blocks must win over a palette's light paper -->
    <link rel="stylesheet" href="/css/palettes.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
    <link rel="stylesheet" href="/css/motion.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div class="app">
      <nav class="sidebar" aria-label="Sections">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true">
            <rect class="ink" width="30" height="30" rx="8"></rect>
            <circle class="paper" cx="8" cy="12" r="1.6"></circle><circle class="paper" cx="13" cy="12" r="1.6"></circle>
            <circle class="paper" cx="17" cy="12" r="1.6"></circle><circle class="paper" cx="8" cy="18" r="1.6"></circle>
            <circle class="paper" cx="13" cy="18" r="1.6"></circle><circle class="paper" cx="17" cy="18" r="1.6"></circle>
            <circle class="sun" cx="22.5" cy="15" r="2.6"></circle>
          </svg>
          <span class="brand-text">
            <span class="brand-name">TC002</span>
            <span class="brand-sub" id="brand-sub"></span>
          </span>
        </div>
        <div id="nav"></div>
        <div class="sidebar-foot" id="config-path"></div>
      </nav>
      <div class="workspace">
        <header class="topbar">
          <button class="btn ghost icon" id="collapse" type="button">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#panel-left"></use></svg>
          </button>
          <div class="crumb" id="crumb"></div>
          <span class="spacer"></span>
          <button class="status-pill" id="status" type="button" aria-live="polite"></button>
          <button class="btn ghost icon" id="quick" type="button">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#sun-dim"></use></svg>
          </button>
          <button class="btn ghost kbd-btn" id="palette-btn" type="button">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
            <kbd>⌘K</kbd>
          </button>
          <button class="btn ghost icon" id="theme" type="button"></button>
          <button class="btn ghost icon lang-btn" id="lang" type="button"></button>
        </header>
        <main id="main" tabindex="-1">
          <section class="device-bar" id="device" aria-label="Preview"></section>
          <div id="page">
            <div class="page"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton short"></div></div>
          </div>
        </main>
      </div>
    </div>
    <div class="savebar" id="savebar" hidden role="status">
      <span class="savebar-dot"></span>
      <span id="savebar-text"></span>
      <kbd>⌘S</kbd>
      <button class="btn ghost" id="discard" type="button"></button>
      <button class="btn primary" id="save" type="button"></button>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </body>
</html>
