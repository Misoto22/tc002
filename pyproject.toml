[project]
name = "tc002"
version = "0.1.0"
description = "Set up and run the Ulanzi TC002 pixel clock from your Mac: settings, rotation, messages and live screens"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = []
authors = [{ name = "Misoto22" }]
keywords = ["ulanzi", "tc002", "pixel clock", "led matrix", "claude code", "smart home"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Misoto22/tc002"
Changelog = "https://github.com/Misoto22/tc002/blob/main/CHANGELOG.md"
Issues = "https://github.com/Misoto22/tc002/issues"

[project.scripts]
tc002 = "tc002.cli:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
# Commented if/else blocks read better than the nested ternaries SIM108 asks for.
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
