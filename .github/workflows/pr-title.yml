# Pull-request titles become squash-commit subjects, which release-please reads to
# pick the next version. Check name: "pr-title / pr-title".

name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: Misoto22/ci/.github/workflows/pr-title.yml@121edc748cf9c4c062572ee9b1275460c4a17a40 # v0.11.0
