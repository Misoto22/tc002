# Pull-request titles become squash-commit subjects, which release-please reads to
# pick the next version. Check name: "pr-title / pr-title".

name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: Misoto22/ci/.github/workflows/pr-title.yml@4cfbd9f5951b9609854a5cba803e5ffcc8634673 # v0.10.0
