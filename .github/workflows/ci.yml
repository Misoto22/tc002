# Lint and test on Linux for every pull request and every push to main.
# Check name: "ci / python-ci".

name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Misoto22/ci/.github/workflows/python-ci.yml@4cfbd9f5951b9609854a5cba803e5ffcc8634673 # v0.10.0
    with:
      python-version: "3.15"
      command: uv run ruff check . && uv run ruff format --check . && uv run pytest
