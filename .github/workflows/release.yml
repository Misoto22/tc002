# Open and maintain the release pull request with the fleet release bot.
# Merging "chore(main): release X.Y.Z" tags vX.Y.Z and publishes the GitHub Release.
# Needs the APP_PRIVATE_KEY secret and APP_CLIENT_ID variable on this repository.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: Misoto22/ci/.github/workflows/release.yml@121edc748cf9c4c062572ee9b1275460c4a17a40 # v0.11.0
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # After a release is cut, build the package from its tag and publish it to PyPI with
  # trusted publishing (OIDC): no token is stored. PyPI must list this repository,
  # workflow and the "pypi" environment as a trusted publisher of the tc002 project.
  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tc002
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
